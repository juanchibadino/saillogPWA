<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sail Player</title>
<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
crossorigin=""
/>
<link rel="stylesheet" href="https://unpkg.com/leaflet-gesture-handling/dist/leaflet-gesture-handling.min.css" crossorigin="" />
<link rel="stylesheet" href="/player.css?v=34" />
</head>
<body>
<div class="app">
<div id="map-wrap">
<div id="map"></div>
<div id="status" class="status hidden" role="status" aria-live="polite"></div>
<div class="trim-tools hidden" aria-label="Trim tools">
  <button id="trimMenuBtn" class="icon" type="button" aria-label="Trims" title="Trims">☰</button>
  <button id="trimSaveBtn" class="icon" type="button" aria-label="Guardar trim" title="Guardar trim">
    <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
      <path d="M5 3h11l3 3v15H5V3zm2 2v4h8V5H7zm0 8v6h10v-6H7zm2 2h6v2H9v-2z"/>
    </svg>
  </button>
</div>
<div class="top-left-stack">
  <section class="kpis hidden" aria-label="KPIs">
    <div class="kpi"><div class="label">SOG (kn)</div><div id="kpi-sog" class="value">—</div></div>
    <div class="kpi"><div class="label">COG/HDG (°)</div><div id="kpi-hdg" class="value">—</div></div>
    <div class="kpi"><div class="label">Heel / Trim</div><div id="kpi-ht" class="value">—</div></div>
    <div class="kpi"><div class="label">Date & Time</div><div id="kpi-time" class="value">—</div></div>
  </section>
</div>

<div class="map-tools hidden" aria-label="Map controls">
  <button id="fitBtn" class="icon" type="button" aria-label="Centrar barco" title="Centrar barco">⤢</button>
  <select id="speed" aria-label="Speed">
    <option value="1">1×</option>
    <option value="2">2×</option>
    <option value="4">4×</option>
    <option value="10">10×</option>
  </select>
  <div class="buoy-control">
    <button id="buoyBtn" class="icon toggle" type="button" aria-label="Agregar boya" title="Agregar boya">+</button>
    <div id="buoyMenu" class="buoy-menu hidden" role="menu" aria-label="Tipo de boya">
      <button type="button" class="buoy-item windward" data-buoy-type="windward">Windward</button>
      <button type="button" class="buoy-item leeward" data-buoy-type="leeward">Leeward</button>
    </div>
  </div>
  <button id="wakeBtn" aria-label="Cambiar modo de track" class="toggle" title="Estela">
    <span class="wake-icon" aria-hidden="true"></span>
  </button>
</div>

<button id="playBtn" class="play-big play-fab hidden" aria-label="Play">
  <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M8 5v14l11-7z"></path>
  </svg>
  <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
    <path d="M6 5h4v14H6zM14 5h4v14h-4z"></path>
  </svg>
</button>
</div>

<div class="player-panel hidden" aria-label="Player controls">
  <div class="player-row playhead-row">
    <div class="playhead">
      <div class="playhead-track" aria-hidden="true"></div>
      <div class="playhead-boundary start" aria-hidden="true"></div>
      <div class="playhead-boundary end" aria-hidden="true"></div>
      <div class="playhead-handle" aria-hidden="true"></div>
      <input id="timeRange" type="range" min="0" max="0" step="1" value="0" aria-label="Progress" />
    </div>
    <span id="idxLabel" class="time">0/0</span>
  </div>

  <div class="player-row clamps-row">
    <div class="trim">
      <div class="trim-track" aria-hidden="true"></div>
      <div class="trim-selection" aria-hidden="true"></div>
      <div class="trim-handle start" aria-hidden="true"></div>
      <div class="trim-handle end" aria-hidden="true"></div>
      <input id="trimStartRange" class="thumb-only" type="range" min="0" max="0" step="1" value="0" aria-label="Start clamp" />
      <input id="trimEndRange" class="thumb-only" type="range" min="0" max="0" step="1" value="0" aria-label="End clamp" />
    </div>
  </div>

  <div class="player-row trim-zoom-row" aria-label="Trim zoom">
    <div id="cacheBadge" class="cache-badge" aria-live="polite"></div>
    <div class="trim-zoom">
      <button id="trimZoomOutBtn" class="trim-zoom-btn" type="button" aria-label="Zoom out trim" title="Zoom out trim">−</button>
      <button id="trimZoomInBtn" class="trim-zoom-btn" type="button" aria-label="Zoom in trim" title="Zoom in trim">+</button>
    </div>
  </div>
</div>
</div>

<div id="trimSaveModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="trimSaveTitle">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="trimSaveTitle">Save trim</h2>
      <button id="trimSaveCloseBtn" class="icon" type="button" aria-label="Close">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-surface">
        <label class="field">
          <div class="field-head">
            <span class="field-label">Name</span>
            <span class="field-meta">Optional</span>
          </div>
          <input id="trimNameInput" type="text" placeholder="Trim name" maxlength="40" />
        </label>
        <div id="trimSaveMsg" class="modal-msg hidden" role="status" aria-live="polite"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button id="trimSaveConfirmBtn" class="primary" type="button">Save</button>
      <button id="trimSaveCancelBtn" class="secondary" type="button">Cancel</button>
    </div>
  </div>
</div>

<div id="trimListModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="trimListTitle">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="trimListTitle">Trims</h2>
      <button id="trimListCloseBtn" class="icon" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-surface">
        <div id="trimListLoading" class="modal-loading hidden" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <div class="loading-text">Loading trims…</div>
        </div>
        <div id="trimListEmpty" class="modal-empty hidden" role="status" aria-live="polite">No trims saved.</div>
        <div id="trimListContainer" class="trim-list"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button id="trimListDoneBtn" class="primary" type="button">Close</button>
    </div>
  </div>
</div>

<div id="trimDeleteModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="trimDeleteTitle">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="trimDeleteTitle">Delete trim</h2>
      <button id="trimDeleteCloseBtn" class="icon" type="button" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-surface">
        <div id="trimDeleteText" class="modal-text" role="status" aria-live="polite"></div>
        <div id="trimDeleteMsg" class="modal-msg hidden" role="status" aria-live="polite"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button id="trimDeleteConfirmBtn" class="danger" type="button">Delete</button>
      <button id="trimDeleteCancelBtn" class="secondary" type="button">Cancel</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet-gesture-handling/dist/leaflet-gesture-handling.min.js" crossorigin=""></script>
<script type="module" src="/player.js?v=34"></script>
</body>
</html>
